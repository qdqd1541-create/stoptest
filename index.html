<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>작업중지 요청서</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C2331">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="작업중지요청서">
<script>
(function(){
  var ua = navigator.userAgent || navigator.vendor || '';
  var isKakao = /KAKAOTALK/i.test(ua);
  var isSamsung = /SamsungBrowser/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  function showBanner(html){
    document.addEventListener('DOMContentLoaded', function(){
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;height:50vh;background:rgba(10,10,10,0.96);color:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;';
      overlay.innerHTML = '<div style="font-size:17px;line-height:1.7;max-width:420px;">' + html + '</div>'
        + '<div style="margin-top:22px;padding:10px 26px;border:1px solid #fff;border-radius:22px;font-size:14px;font-weight:700;">닫기</div>';
      overlay.querySelector('div:last-child').addEventListener('click', function(){ overlay.remove(); });
      document.body.prepend(overlay);
    });
  }
